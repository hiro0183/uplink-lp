<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>誰でも触れるAI入門編 チラシ（たたき台）｜合同会社UP LINK</title>
<meta name="description" content="2027年2月の研修に向けたAI入門編チラシのたたき台。内容は変更の可能性があります。">
<meta property="og:title" content="誰でも触れるAI入門編 チラシ（たたき台）">
<meta property="og:description" content="AI知識ゼロの方向け、A4両面チラシのたたき台。QRは仮です。">
<meta property="og:image" content="https://hiro0183.github.io/uplink-lp/ai-nyumon/p1.png">
<meta property="og:type" content="website">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
:root{
  --bg:#F3EFE4; --paper:#FFFFFF; --ink:#1F3329; --ink2:#4A5C50; --mut:#75837A;
  --green:#2F5D46; --line:#D9D2BC; --note-bg:#FBF1DF; --note-ink:#7A4E12;
  --shadow:0 10px 30px rgba(31,51,41,.14);
  --fm:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --ff:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15211B; --paper:#1D2B24; --ink:#EEF3EE; --ink2:#C6D3C8; --mut:#93A396;
    --green:#8CD3AC; --line:#2F4237; --note-bg:#2E2719; --note-ink:#E6C27A;
    --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:700;color:var(--green);margin:0}
h1{font-family:var(--fm);font-size:clamp(22px,4.2vw,30px);line-height:1.35;margin:0;text-wrap:balance}
.sub{margin:0;color:var(--ink2);font-size:14px}
.note{background:var(--note-bg);color:var(--note-ink);border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.6;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:0}
.btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:11px 18px;border-radius:999px}
@media (prefers-color-scheme: dark){.btn{color:#0E1913}}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
figure{margin:0;display:flex;flex-direction:column;gap:10px}
figcaption{font-size:13px;color:var(--mut);letter-spacing:.08em;font-weight:700;display:flex;align-items:center;gap:10px}
figcaption::after{content:"";flex:1;height:1px;background:var(--line)}
figure a{display:block}
figure img{display:block;width:100%;max-width:100%;height:auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
footer{border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
footer b{color:var(--ink);font-weight:700}
footer a{color:var(--green)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">A4 両面チラシ｜たたき台</p>
    <h1>誰でも触れる、AI入門編</h1>
    <p class="sub">2026年11月3日版（v2.2）。表面・裏面の順に並んでいます。画像をタップすると大きく開きます。</p>
    <p class="note">このページは検討用のたたき台です。内容はこれから変わります。QRコードは仮のもので、読み取っても「準備中」と出るだけです。日程・会場・肩書などは確定後に差し替えます。</p>
    <p class="actions"><a class="btn" href="flyer.pdf" target="_blank" rel="noopener">PDFで開く（A4・2ページ）</a></p>
  </header>

  <figure>
    <figcaption>表面</figcaption>
    <a href="p1.png" target="_blank" rel="noopener"><img src="p1.png" alt="チラシ表面：キーボードは3本指。それでも集客も請求書もAIに任せられました。3つの仕事と成長曲線、研修の案内" width="1405" height="1988" loading="eager"></a>
  </figure>

  <figure>
    <figcaption>裏面</figcaption>
    <a href="p2.png" target="_blank" rel="noopener"><img src="p2.png" alt="チラシ裏面：今日できる最初の一歩、研修でやること4つ、AIに渡せる仕事の表、講師プロフィール、よくある質問" width="1405" height="1988" loading="lazy"></a>
  </figure>

  <footer>
    <b>合同会社UP LINK　成相 裕康</b>
    <span>経営者の時間を、1日2時間つくる仕事をしています。</span>
    <span><a href="../">UP LINKのページへ</a></span>
  </footer>
</div>
</body>
</html>
