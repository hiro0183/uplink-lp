<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>AI関所 士業版</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@600;800&display=swap');

:root{
  --paper:#eceeeb;
  --sheet:#f9faf8;
  --ink:#1b1e25;
  --ink-soft:#4a4f5a;
  --rule:#9da29c;
  --rule-soft:#d7dad5;
  --vermilion:#c3301c;
  --vermilion-ink:#ffffff;
  --vermilion-soft:#f4d9d3;
  --redact-bg:#1b1e25;
  --redact-fg:#f2f3f0;
  --focus:#c3301c;
  --restored:#0f5a2e;
  --restored-bg:rgba(40,130,80,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14161a;
    --sheet:#1c1f24;
    --ink:#e9e8e3;
    --ink-soft:#a9adb5;
    --rule:#555a62;
    --rule-soft:#2c3036;
    --vermilion:#ee6a55;
    --vermilion-ink:#1a0c09;
    --vermilion-soft:#3a1d18;
    --redact-bg:#e9e8e3;
    --redact-fg:#14161a;
    --focus:#ff8a76;
    --restored:#8fe0b0;
    --restored-bg:rgba(90,200,140,.20);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14161a;
  --sheet:#1c1f24;
  --ink:#e9e8e3;
  --ink-soft:#a9adb5;
  --rule:#555a62;
  --rule-soft:#2c3036;
  --vermilion:#ee6a55;
  --vermilion-ink:#1a0c09;
  --vermilion-soft:#3a1d18;
  --redact-bg:#e9e8e3;
  --redact-fg:#14161a;
  --focus:#ff8a76;
  --restored:#8fe0b0;
  --restored-bg:rgba(90,200,140,.20);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  font-size:16px;
  line-height:1.7;
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.mast{padding:24px 0 16px;border-bottom:3px double var(--ink)}
.mast h1{
  margin:0;font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  font-weight:800;font-size:26px;line-height:1.45;letter-spacing:.02em;
}
.mast h1 .hanko{
  display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
  width:34px;height:34px;margin-right:8px;border-radius:50%;
  border:2.5px solid var(--vermilion);color:var(--vermilion);
  font-size:20px;line-height:1;transform:rotate(-6deg);
}
.mast p{margin:6px 0 0;color:var(--ink-soft);font-size:16px}

.step{margin-top:26px}
.step h2{
  margin:0 0 8px;
  font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  font-weight:800;font-size:22px;letter-spacing:.03em;
}
.sub{margin:0 0 6px;font-size:16px;color:var(--ink-soft)}

textarea{
  display:block;width:100%;margin:0;padding:12px;
  font:inherit;font-size:16px;line-height:1.8;color:var(--ink);
  border:1px solid var(--rule);border-radius:2px;resize:vertical;
  background-color:var(--sheet);
  overflow-wrap:anywhere;
}
#srcText{min-height:15rem}
#rosterText{min-height:7rem}
#replyText{min-height:9rem}

.btn{
  min-height:48px;padding:8px 16px;border:1.5px solid var(--ink);border-radius:2px;
  background:var(--sheet);color:var(--ink);font:inherit;font-size:18px;font-weight:700;cursor:pointer;
}
.btn:hover{background:var(--rule-soft)}
.btn.big{display:block;width:100%;min-height:64px;font-size:22px;letter-spacing:.2em;margin-top:14px}
.btn.copy{display:block;width:100%;min-height:58px;margin-top:12px;font-size:20px}
.btn.primary{background:var(--vermilion);border-color:var(--vermilion);color:var(--vermilion-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.ink:hover{filter:brightness(1.2)}
.btn.block{display:block;width:100%;margin-top:10px}
.textbtn{
  display:inline-block;margin:0 0 6px;padding:6px 0;border:0;background:none;
  color:var(--ink-soft);font:inherit;font-size:16px;text-decoration:underline;cursor:pointer;
}
.textbtn:hover{color:var(--ink)}
.row{display:flex;justify-content:flex-end}

.panel{
  background:var(--sheet);border:1px solid var(--rule);border-radius:2px;
  padding:12px 14px;min-height:7rem;
  white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;
  font-size:16px;line-height:1.95;
}
.panel .ph{color:var(--ink-soft)}

.tok{
  display:inline-block;padding:0 6px;margin:0 1px;border-radius:2px;
  background:var(--redact-bg);color:var(--redact-fg);font-weight:700;font-size:.92em;line-height:1.6;
}
.tok.plain{background:transparent;color:var(--ink);border-bottom:2px solid var(--vermilion);padding:0}
.rest{background:var(--restored-bg);color:var(--restored);font-weight:700;border-bottom:2px solid var(--restored);padding:0 2px}
.warn{background:var(--vermilion-soft);border-bottom:2px dashed var(--vermilion);padding:0 2px}

.summary{
  margin:10px 0 0;padding:10px 12px;border-left:5px solid var(--ink);
  background:var(--sheet);font-size:16px;font-weight:700;overflow-wrap:anywhere;
}
.status{min-height:1.7em;margin:8px 0 0;font-size:16px;font-weight:700;color:var(--restored)}
.status.err{color:var(--vermilion)}

details{margin-top:18px;border:1px solid var(--rule);background:var(--sheet);border-radius:2px}
details>summary{
  min-height:52px;padding:12px 14px;cursor:pointer;font-size:18px;font-weight:700;
  display:flex;align-items:center;
}
details[open]>summary{border-bottom:1px solid var(--rule-soft)}
.inner{padding:14px}
.inner label.lbl{display:block;font-weight:700;font-size:16px;margin:0 0 6px}
.inner .res{margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;font-size:17px;cursor:pointer;min-height:48px;margin:6px 0}
.opt input{width:24px;height:24px;accent-color:var(--vermilion);flex:none}
.hint{margin:0 0 8px;color:var(--ink-soft);font-size:15px}
.setgap{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule-soft)}

.sweep{animation:sweep .7s ease-out}
@keyframes sweep{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion: reduce){.sweep{animation:none}}

.foot{margin-top:32px;padding-top:12px;border-top:1px solid var(--rule);font-size:14px;color:var(--ink-soft)}
</style>

<div class="wrap">
  <header class="mast">
    <h1><span class="hanko" aria-hidden="true">関</span>AIに貼る前に、名前や番号を隠します</h1>
    <p>この画面の中だけで処理します。どこにも送りません</p>
  </header>

  <section class="step" aria-labelledby="h1">
    <h2 id="h1">① 文章を貼る</h2>
    <button type="button" class="textbtn" id="btnClearSample">サンプルを消す</button>
    <textarea id="srcText" spellcheck="false" autocomplete="off" aria-label="隠したい文章"></textarea>
    <button type="button" class="btn big primary" id="btnHide">隠す</button>
  </section>

  <section class="step" aria-labelledby="h2">
    <h2 id="h2">② 隠した文章</h2>
    <div class="panel" id="outText" tabindex="0" aria-label="隠した文章"></div>
    <div class="summary" id="summary" aria-live="polite"></div>
    <button type="button" class="btn copy ink" id="btnCopy">コピーしてAIに貼る</button>
    <p class="status" id="copyStatus" role="status" aria-live="polite"></p>
  </section>

  <details>
    <summary>AIの返事を本名に戻す</summary>
    <div class="inner">
      <label class="lbl" for="replyText">AIの返事を貼る</label>
      <textarea id="replyText" spellcheck="false" autocomplete="off"></textarea>
      <button type="button" class="textbtn" id="btnSampleReply" style="margin-top:6px">サンプル返答を入れる</button>
      <button type="button" class="btn block primary" id="btnRestore">戻す</button>
      <div class="res">
        <span class="lbl" style="font-weight:700">戻した結果</span>
        <div class="panel" id="restoredText" tabindex="0" aria-label="戻した結果"></div>
        <p class="status err" id="restoreStatus" role="status" aria-live="polite"></p>
      </div>
    </div>
  </details>

  <details>
    <summary>細かい設定</summary>
    <div class="inner">
      <label class="lbl" for="rosterText">名前を確実に隠したい人を1行1人で</label>
      <p class="hint">苗字と名前の間は空白を入れてください。</p>
      <textarea id="rosterText" spellcheck="false" autocomplete="off"></textarea>

      <div class="setgap">
        <label class="opt" for="optBirth"><input type="checkbox" id="optBirth" checked>生年月日を年代に丸める（1978年4月3日 → 1970年代生まれ）</label>
        <label class="opt" for="optAmount"><input type="checkbox" id="optAmount">金額も隠す</label>
      </div>

      <div class="setgap">
        <p class="hint">隠していないものがあれば、上の「① 文章を貼る」でその文字を選んでから、このボタンを押してください。</p>
        <button type="button" class="btn block" id="btnManual">選んだ文字も隠す</button>
        <p class="status" id="manualStatus" role="status" aria-live="polite"></p>
      </div>
    </div>
  </details>

  <footer class="foot">
    自動なので見落としがあります。AIに貼る前に、ざっと目で確認してください。
  </footer>
</div>

<script>
/*PURE-START*/
var DG='[0-9０-９]';
var HY='[-－ー−‐]';
var KJ='一-龥々';
var KA='ァ-ヶー';
var HI='ぁ-ん';
var AL='A-Za-zＡ-Ｚａ-ｚ0-9０-９';

function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function nfkc(s){return s.normalize?s.normalize('NFKC'):s;}
function nospace(s){return nfkc(s).replace(/[\s　]+/g,'');}
function onespace(s){return s.replace(/[\s　]+/g,' ').trim();}

var LEGAL='株式会社|有限会社|合同会社|合資会社|合名会社|一般社団法人|公益社団法人|一般財団法人|公益財団法人|社会福祉法人|医療法人社団|医療法人財団|医療法人|学校法人|税理士法人|社会保険労務士法人|司法書士法人|弁護士法人|行政書士法人|特定非営利活動法人|宗教法人';
var PREFS='北海道|青森県|岩手県|宮城県|秋田県|山形県|福島県|茨城県|栃木県|群馬県|埼玉県|千葉県|東京都|神奈川県|新潟県|富山県|石川県|福井県|山梨県|長野県|岐阜県|静岡県|愛知県|三重県|滋賀県|京都府|大阪府|兵庫県|奈良県|和歌山県|鳥取県|島根県|岡山県|広島県|山口県|徳島県|香川県|愛媛県|高知県|福岡県|佐賀県|長崎県|熊本県|大分県|宮崎県|鹿児島県|沖縄県';
var NUMADDR=DG+'+(?:丁目|番地?|'+HY+'|の)'+DG+'+(?:(?:番地?|'+HY+'|号|の)'+DG+'+)?号?';
var BUILD='(?:[ 　]*(?:コーポ|ハイツ|メゾン|パレス|グランド|シャトー)['+KJ+HI+KA+AL+']{0,8}(?:'+DG+'{1,4}(?:号室|号|階))?'
  +'|[ 　]*['+KJ+HI+KA+AL+']{1,12}?(?:ビルディング|ビル|マンション|ハイツ|コーポ|アパート|レジデンス|タワー|荘|センター|プラザ|ヒルズ|ヴィラ)(?:[ 　]*'+DG+'{1,4}(?:階|号室|号|[FＦfｆ]))?'
  +'|[ 　]'+DG+'{1,2}(?:階|[FＦ]))?';
var ADDR_PREF='(?:'+PREFS+')[^\\s　、。，,（）()「」]{0,30}?'+NUMADDR+BUILD;
var ADDR_CITY='(?<!['+KJ+'])['+KJ+']{1,5}[市区郡町村]['+KJ+HI+KA+']{0,12}?'+NUMADDR+BUILD;

var NAMEBODY='(?:['+HI+']{1,5}['+KJ+KA+AL+']['+KJ+KA+AL+']{0,9}|['+KJ+KA+AL+']{1,10}|['+HI+']{2,6}(?!['+HI+KA+KJ+']))';
var COMPANY_PRE='(?:'+LEGAL+')[ 　]?'+NAMEBODY;
var COMPANY_SUF='(?<!['+KJ+KA+'])['+KJ+KA+'A-Za-z0-9]{1,10}(?:'+LEGAL+')';
var COMPANY_KABU='[（(]株[）)][ 　]?'+NAMEBODY;

var DATE='(?:(?:令和|平成|昭和|大正)(?:元|'+DG+'{1,2})年'+DG+'{1,2}月'+DG+'{1,2}日'
  +'|(?<!'+DG+')'+DG+'{4}年'+DG+'{1,2}月'+DG+'{1,2}日'
  +'|(?<!'+DG+')'+DG+'{4}[/／.\\-－]'+DG+'{1,2}[/／.\\-－]'+DG+'{1,2}(?!'+DG+'))';

var BANK_MAIN='['+KJ+KA+HI+']{1,8}(?:銀行|信用金庫|信用組合|労働金庫|農業協同組合)[ 　]*'
  +'(?:['+KJ+KA+HI+']{1,10}(?:支店|支所|出張所)[ 　]*)?'
  +'(?:(?:普通|当座|貯蓄)(?:預金)?[ 　]*)?(?:口座)?[ 　]*(?:番号)?[ 　:：]*'+DG+'{6,8}(?!'+DG+')';
var BANK_LABEL='(?:口座番号|口座)[ 　:：]*'+DG+'{6,8}(?!'+DG+')';

var TITLES='代表取締役社長|代表取締役|専務取締役|常務取締役|取締役|副社長|社長|専務|常務|部長|課長|係長|主任|店長|所長|院長|会長|理事長|代表|先生';
var HON='さん|様|氏|先生|社長|専務|常務|部長|課長|代表|殿|君|ちゃん|院長|所長|理事長|会長|取締役|係長|主任|店長';
var PREFIXES=['代表取締役社長','代表取締役','専務取締役','常務取締役','従業員','担当者','相続人','依頼者','配偶者','副社長','理事長','取締役','社員','職員','役員','担当','顧問','経理','総務','先代','社長','専務','常務','部長','課長','係長','主任','店長','所長','院長','会長','代表','税理士','社労士','司法書士','行政書士','弁護士','先生','故'];
var STOPWORDS=['担当者','関係者','責任者','代表者','従業員','貴社','弊社','本人','当事者','相続人','依頼者','配偶者','事務所','先方','先代','顧問','社員','職員','役員','各位','お客'];
var REJECT_HAS=/会社|銀行|税務|労務|年金|保険|事務|法人|給与|相続|贈与|退職|時間|残業|申告|決算|経営|契約|書類|手続|交代|方針|面談|郵便|顧問|様|殿/;
var REJECT_END=/[者員社署係課物]$/;
var REJECT_START=/^[者印取宛及等会社員様殿先]/;

var KINDS={
  '人物':{tok:'人物',cls:'person',alpha:true},
  '会社':{tok:'会社',cls:'company',alpha:true},
  '電話':{tok:'電話',cls:'phone'},
  'メール':{tok:'メール',cls:'mail'},
  '郵便番号':{tok:'郵便',cls:'post'},
  '住所':{tok:'住所',cls:'addr'},
  '番号':{tok:'番号',cls:'num'},
  '口座':{tok:'口座',cls:'bank'},
  'カード':{tok:'カード',cls:'card'},
  '日付':{tok:'日付',cls:'date'},
  '生年月日':{tok:'生年月日',cls:'birth'},
  '金額':{tok:'金額',cls:'amount'},
  '手動':{tok:'秘匿',cls:'manual'}
};
var KIND_ORDER=['人物','会社','電話','メール','郵便番号','住所','番号','口座','カード','生年月日','日付','金額','手動'];

function ckey(raw){
  return nfkc(raw).replace(new RegExp(LEGAL,'g'),'').replace(/[（(]株[）)]/g,'').replace(/[\s　]+/g,'');
}
function eraYear(era,n){var base={'令和':2018,'平成':1988,'昭和':1925,'大正':1911}[era];return base+n;}
function birthYear(raw){
  var s=nfkc(raw);var m;
  if((m=s.match(/^(令和|平成|昭和|大正)(元|\d+)年/))){return eraYear(m[1],m[2]==='元'?1:parseInt(m[2],10));}
  if((m=s.match(/^(\d{4})/))){return parseInt(m[1],10);}
  return null;
}
function parseRoster(text){
  var out=[];
  String(text||'').split(/\r?\n/).forEach(function(line){
    var t=line.trim();if(!t)return;
    if(new RegExp(LEGAL).test(t)||/[（(]株[）)]/.test(t)){out.push({type:'company',raw:t});return;}
    var parts=t.split(/[\s　]+/);
    var e={type:'person',canon:parts.join(' '),full:null,sur:null,given:null};
    if(parts.length>=2){e.sur=parts[0];e.given=parts.slice(1).join('');e.full=esc(e.sur)+'[ 　]*'+esc(e.given);}
    else{
      e.full=esc(t);
      if(t.length>=4){e.sur=t.slice(0,2);e.given=t.slice(2);}
    }
    out.push(e);
  });
  return out;
}
function stripLeading(c){
  var s=c;var again=true;
  while(again&&s.length){
    again=false;
    for(var i=0;i<PREFIXES.length;i++){
      var p=PREFIXES[i];
      if(s.indexOf(p)===0){s=s.slice(p.length).replace(/^[ 　]+/,'');again=true;break;}
    }
    if(!again){
      var sp=s.search(/[ 　]/);
      if(sp>0){
        var first=s.slice(0,sp);
        if(PREFIXES.indexOf(first)>=0||STOPWORDS.indexOf(first)>=0||first==='事務所'){s=s.slice(sp).replace(/^[ 　]+/,'');again=true;}
      }
    }
  }
  return s;
}
function validName(c){
  var n=c.replace(/[ 　]+/g,'');
  if(n.length<2||n.length>6)return false;
  if(c.indexOf(' ')>=0||c.indexOf('　')>=0){
    var parts=c.split(/[ 　]+/);
    if(parts.length!==2||parts[0].length>4||parts[1].length>3)return false;
  }else if(n.length>4)return false;
  if(STOPWORDS.indexOf(n)>=0||PREFIXES.indexOf(n)>=0)return false;
  if(REJECT_HAS.test(n)||REJECT_END.test(n)||REJECT_START.test(n))return false;
  return true;
}

function detect(text,opts){
  opts=opts||{};
  text=String(text||'');
  var roster=parseRoster(opts.roster||'');
  var accepted=[];
  function overlaps(s,e){for(var i=0;i<accepted.length;i++){var a=accepted[i];if(s<a.end&&e>a.start)return true;}return false;}
  function add(s,e,kind,key,canon,extra){
    if(e<=s||overlaps(s,e))return false;
    var o={start:s,end:e,kind:kind,key:key,canon:canon,raw:text.slice(s,e)};
    if(extra)for(var k in extra)o[k]=extra[k];
    accepted.push(o);return true;
  }
  function scan(re,fn){
    re.lastIndex=0;var m;
    while((m=re.exec(text))){
      if(m[0].length===0){re.lastIndex++;continue;}
      fn(m);
    }
  }
  function R(src){return new RegExp(src,'g');}
  var foundPersons={};   // key -> canon
  var foundCompanies={}; // key -> raw

  // 0. manual
  (opts.manual||[]).forEach(function(s){
    if(!s)return;
    var i=0;
    while((i=text.indexOf(s,i))>=0){add(i,i+s.length,'手動',s,s,{});i+=s.length;}
  });

  // 1. email
  scan(R('[A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}'),function(m){
    add(m.index,m.index+m[0].length,'メール',m[0].toLowerCase(),m[0]);
  });
  // 2. credit card
  scan(R('(?<!'+DG+')(?:'+DG+'{4}[ 　\\-－ー]){3}'+DG+'{4}(?!'+DG+')'),function(m){
    add(m.index,m.index+m[0].length,'カード',nfkc(m[0]).replace(/\D/g,''),m[0]);
  });
  scan(R('(?<!'+DG+')'+DG+'{16}(?!'+DG+')'),function(m){
    add(m.index,m.index+m[0].length,'カード',nfkc(m[0]).replace(/\D/g,''),m[0]);
  });
  // 3. corporate number (13)
  scan(R('(?<!'+DG+')'+DG+'{13}(?!'+DG+')'),function(m){
    add(m.index,m.index+m[0].length,'番号',nfkc(m[0]),m[0],{sub:'法人番号'});
  });
  // 4. my number (12)
  scan(R('(?<!'+DG+')'+DG+'{4}[ 　\\-－ー]?'+DG+'{4}[ 　\\-－ー]?'+DG+'{4}(?!'+DG+')'),function(m){
    add(m.index,m.index+m[0].length,'番号',nfkc(m[0]).replace(/\D/g,''),m[0],{sub:'マイナンバー'});
  });
  // 5. phone
  var phoneRes=[
    '(?<![0-9０-９\\-－])[0０]'+DG+'{1,4}'+HY+DG+'{1,4}'+HY+DG+'{3,4}(?!'+DG+')',
    '[(（][0０]'+DG+'{1,4}[)）][ 　]?'+DG+'{1,4}'+HY+DG+'{3,4}(?!'+DG+')',
    '(?<!'+DG+')[0０]'+DG+'{9,10}(?!'+DG+')'
  ];
  phoneRes.forEach(function(src){
    scan(R(src),function(m){
      var d=nfkc(m[0]).replace(/\D/g,'');
      if(d.length<10||d.length>11)return;
      add(m.index,m.index+m[0].length,'電話',d,m[0]);
    });
  });
  // 6. postal
  scan(R('(?:〒[ 　]?)?(?<![0-9０-９\\-－])'+DG+'{3}[-－ー]'+DG+'{4}(?![0-9０-９\\-－])'),function(m){
    add(m.index,m.index+m[0].length,'郵便番号',nfkc(m[0]).replace(/[〒\s]/g,'').replace(/ー/g,'-'),m[0]);
  });
  // 7. bank
  [BANK_MAIN,BANK_LABEL].forEach(function(src){
    scan(R(src),function(m){
      add(m.index,m.index+m[0].length,'口座',nospace(m[0]),onespace(m[0]));
    });
  });
  // 8. address
  [ADDR_PREF,ADDR_CITY].forEach(function(src){
    scan(R(src),function(m){
      add(m.index,m.index+m[0].length,'住所',nospace(m[0]),onespace(m[0]));
    });
  });
  // 9. dates
  scan(R(DATE),function(m){
    var s=m.index,e=s+m[0].length;
    var before=text.slice(Math.max(0,s-8),s);
    var after=text.slice(e,e+5);
    var suffix='';
    var sm=after.match(/^[ 　]?(?:生まれ|生)(?![年活涯産命保])/);
    if(sm)suffix=sm[0];
    var isBirth=!!suffix||/生年月日|誕生日|生まれ/.test(before);
    if(isBirth){
      add(s,e+suffix.length,'生年月日',nospace(m[0]),m[0],{date:m[0],suffix:suffix});
    }else{
      add(s,e,'日付',nospace(m[0]),m[0]);
    }
  });
  // 10. company
  function addCompany(m){
    var raw=m[0];
    var cut=raw.replace(/(?:御中|様|殿|宛)$/,'');
    if(cut.length!==raw.length)raw=cut;
    var key=ckey(raw);
    if(key.length<1)return;
    if(add(m.index,m.index+raw.length,'会社',key,onespace(raw)))foundCompanies[key]=onespace(raw);
  }
  roster.forEach(function(r){
    if(r.type!=='company')return;
    var key=ckey(r.raw);
    foundCompanies[key]=r.raw;
    scan(R(r.raw.split('').map(esc).join('[ 　]*')),function(m){add(m.index,m.index+m[0].length,'会社',key,r.raw,{fixed:true});});
  });
  [COMPANY_PRE,COMPANY_KABU,COMPANY_SUF].forEach(function(src){scan(R(src),addCompany);});
  // 11. amount
  if(opts.amount){
    scan(R('(?:[¥￥]'+DG+'[0-9０-９,，]*|'+DG+'[0-9０-９,，]*(?:\\.'+DG+'+)?(?:万[0-9０-９,，]*|億[0-9０-９,，万]*|千)?円)'),function(m){
      add(m.index,m.index+m[0].length,'金額',nfkc(m[0]).replace(/[,\s]/g,''),m[0]);
    });
  }
  // 12. roster full names
  roster.forEach(function(r,i){
    if(r.type!=='person')return;
    scan(R(r.full),function(m){add(m.index,m.index+m[0].length,'人物','r'+i,r.canon,{fixed:true});});
  });
  // 13. honorific / title based names
  var aliasSet={};
  roster.forEach(function(r){if(r.type==='person'){if(r.sur)aliasSet[nospace(r.sur)]=1;if(r.given)aliasSet[nospace(r.given)]=1;aliasSet[nospace(r.canon)]=1;}});
  function addHon(orig,startIdx){
    var s=stripLeading(orig);
    var off=orig.length-s.length;
    s=s.replace(/[ 　]+$/,'');
    if(!s||!validName(s))return;
    var n=nospace(s);
    if(aliasSet[n])return;
    if(add(startIdx+off,startIdx+off+s.length,'人物','n|'+n,onespace(s)))foundPersons['n|'+n]=onespace(s);
  }
  scan(R('(['+KJ+']{1,4}[ 　]['+KJ+']{1,3}|['+KJ+']{2,8})(?=(?:'+HON+'))'),function(m){addHon(m[1],m.index);});
  scan(R('(?:'+TITLES+')[ 　:：]+(['+KJ+']{1,4}[ 　]['+KJ+']{1,3}|['+KJ+']{2,4})(?!['+KJ+'])'),function(m){
    addHon(m[1],m.index+m[0].length-m[1].length);
  });
  // 14. roster aliases
  roster.forEach(function(r,i){
    if(r.type!=='person')return;
    if(r.sur&&r.sur.length>=2){
      scan(R(esc(r.sur)+'(?![市区町村県郡])'),function(m){add(m.index,m.index+m[0].length,'人物','r'+i,r.canon,{fixed:true});});
    }
    if(r.given&&r.given.length>=2){
      scan(R(esc(r.given)+'(?=(?:'+HON+'))'),function(m){add(m.index,m.index+m[0].length,'人物','r'+i,r.canon,{fixed:true});});
    }
  });
  // 15. dynamic literals (found names / company short names)
  Object.keys(foundPersons).forEach(function(k){
    var name=foundPersons[k];
    var src=nospace(name).split('').map(esc).join('[ 　]*');
    scan(R(src),function(m){add(m.index,m.index+m[0].length,'人物',k,name);});
  });
  Object.keys(foundCompanies).forEach(function(k){
    if(k.length>=3){
      scan(R(k.split('').map(esc).join('[ 　]*')),function(m){add(m.index,m.index+m[0].length,'会社',k,foundCompanies[k]);});
    }
  });

  accepted.sort(function(a,b){return a.start-b.start;});
  return accepted;
}

function alphaLabel(i){return i<26?String.fromCharCode(65+i):String(i+1);}

function apply(text,matches,opts){
  opts=opts||{};
  var dis=opts.disabled||{};
  var groups=[],gmap={};
  matches.forEach(function(m){
    var id=m.kind+'|'+m.key;
    var g=gmap[id];
    if(!g){g=gmap[id]={id:id,kind:m.kind,sub:m.sub||'',key:m.key,canon:m.canon,fixed:!!m.fixed,count:0,enabled:!dis[id],token:null,rep:null,oneWay:false};groups.push(g);}
    g.count++;
    if(m.fixed&&!g.fixed){g.canon=m.canon;g.fixed=true;}
    else if(!g.fixed&&m.canon&&m.canon.length>g.canon.length&&m.kind!=='生年月日'){g.canon=m.canon;}
    if(m.kind==='生年月日'&&m.date)g.canon=m.date;
  });
  var counters={};
  groups.forEach(function(g){
    if(!g.enabled)return;
    if(g.kind==='生年月日'&&opts.birthRound){
      var y=birthYear(g.canon);
      if(y){g.rep=(Math.floor(y/10)*10)+'年代生まれ';g.oneWay=true;return;}
    }
    var info=KINDS[g.kind];
    var c=counters[info.tok]=(counters[info.tok]||0)+1;
    g.token='【'+info.tok+(info.alpha?alphaLabel(c-1):c)+'】';
    g.rep=g.token;
  });
  var pieces=[],out='',last=0;
  function push(t,piece){out+=t;pieces.push(piece);}
  matches.forEach(function(m){
    if(m.start>last){push(text.slice(last,m.start),{t:'text',s:text.slice(last,m.start)});}
    var g=gmap[m.kind+'|'+m.key];
    if(!g.enabled){push(m.raw,{t:'text',s:m.raw});}
    else if(g.oneWay){
      push(g.rep,{t:'plain',s:g.rep,id:g.id});
    }else{
      push(g.rep,{t:'tok',s:g.rep,id:g.id});
      if(m.suffix)push(m.suffix,{t:'text',s:m.suffix});
    }
    last=m.end;
  });
  if(last<text.length)push(text.slice(last),{t:'text',s:text.slice(last)});
  var counts={},total=0;
  groups.forEach(function(g){if(g.enabled){counts[g.kind]=(counts[g.kind]||0)+1;total+=g.count;}});
  var parts=[];
  KIND_ORDER.forEach(function(k){if(counts[k])parts.push(KINDS[k].tok+counts[k]);});
  var mapping=groups.filter(function(g){return g.enabled&&g.token;}).map(function(g){return {token:g.token,kind:g.kind,canon:g.canon,count:g.count};});
  return {output:out,pieces:pieces,groups:groups,mapping:mapping,summary:parts.join('・'),total:total};
}

function restore(reply,mapping){
  var map={};
  mapping.forEach(function(m){map[m.token]=m.canon;});
  var re=/【([^【】\n]{1,12})】/g,m,last=0,pieces=[],out='',unresolved=[];
  var known=/^(人物|会社|電話|メール|住所|番号|口座|日付|生年月日|金額|郵便|カード|秘匿)[A-Z0-9]+$/;
  reply=String(reply||'');
  while((m=re.exec(reply))){
    if(m.index>last){pieces.push({t:'text',s:reply.slice(last,m.index)});out+=reply.slice(last,m.index);}
    var tk='【'+m[1].replace(/[\s　]+/g,'')+'】';
    if(Object.prototype.hasOwnProperty.call(map,tk)){pieces.push({t:'rest',s:map[tk]});out+=map[tk];}
    else{
      pieces.push({t:known.test(m[1].replace(/[\s　]+/g,''))?'warn':'text',s:m[0]});out+=m[0];
      if(known.test(m[1].replace(/[\s　]+/g,'')))unresolved.push(m[0]);
    }
    last=m.index+m[0].length;
  }
  if(last<reply.length){pieces.push({t:'text',s:reply.slice(last)});out+=reply.slice(last);}
  return {text:out,pieces:pieces,unresolved:unresolved};
}

var KIND_LABEL={'人物':'人の名前','会社':'会社名','電話':'電話','メール':'メール','郵便番号':'郵便番号','住所':'住所','番号':'番号','口座':'口座','カード':'カード','生年月日':'生年月日','日付':'日付','金額':'金額','手動':'手動で追加'};

if(typeof document!=='undefined'){(function(){
  var $=function(id){return document.getElementById(id);};
  var state={manual:[],last:null};

  function say(id,msg,isErr){var el=$(id);el.textContent=msg||'';el.className='status'+(isErr?' err':'');}
  function clear(el){while(el.firstChild)el.removeChild(el.firstChild);}
  function span(cls,txt){var s=document.createElement('span');s.className=cls;s.textContent=txt;return s;}

  function summaryText(res){
    var counts={};
    res.groups.forEach(function(g){if(g.enabled)counts[g.kind]=(counts[g.kind]||0)+1;});
    var parts=[];
    KIND_ORDER.forEach(function(k){if(counts[k])parts.push(KIND_LABEL[k]+' '+counts[k]+'件');});
    return parts.length?parts.join('・')+'を隠しました':'';
  }
  function renderOut(res,empty){
    var box=$('outText');clear(box);
    var sm=$('summary');
    if(empty){
      box.appendChild(span('ph','① に文章を貼って「隠す」を押すと、ここに結果が出ます。'));
      sm.textContent='';sm.style.display='none';return;
    }
    res.pieces.forEach(function(p){
      if(p.t==='text')box.appendChild(document.createTextNode(p.s));
      else box.appendChild(span(p.t==='plain'?'tok plain':'tok',p.s));
    });
    var t=summaryText(res);
    sm.style.display='';
    sm.textContent=t||'隠すものは見つかりませんでした。';
  }
  function renderRestore(){
    var reply=$('replyText').value;var box=$('restoredText');clear(box);
    if(!reply){say('restoreStatus','');return;}
    var r=restore(reply,state.last?state.last.mapping:[]);
    r.pieces.forEach(function(p){
      if(p.t==='text')box.appendChild(document.createTextNode(p.s));
      else box.appendChild(span(p.t,p.s));
    });
    if(r.unresolved.length)say('restoreStatus','名前の置き換え表にない記号があります（赤の点線）：'+r.unresolved.filter(function(v,i,a){return a.indexOf(v)===i;}).join(' '),true);
    else say('restoreStatus','');
  }
  function render(){
    var text=$('srcText').value;
    var matches=detect(text,{roster:$('rosterText').value,manual:state.manual,amount:$('optAmount').checked});
    var res=apply(text,matches,{disabled:{},birthRound:$('optBirth').checked});
    state.last=res;
    renderOut(res,!text.replace(/[\s　]+/g,''));
    renderRestore();
  }
  function selectNode(node){
    var r=document.createRange();r.selectNodeContents(node);
    var s=window.getSelection();s.removeAllRanges();s.addRange(r);
  }

  $('srcText').value=SAMPLE_MEMO;
  $('rosterText').value=SAMPLE_ROSTER;
  ['srcText','rosterText'].forEach(function(id){$(id).addEventListener('input',function(){say('copyStatus','');render();});});
  ['optBirth','optAmount'].forEach(function(id){$(id).addEventListener('change',function(){say('copyStatus','');render();});});

  $('btnClearSample').addEventListener('click',function(){
    $('srcText').value='';$('rosterText').value='';state.manual=[];
    say('copyStatus','');say('manualStatus','');render();$('srcText').focus();
  });
  $('btnHide').addEventListener('click',function(){
    say('copyStatus','');render();

  $('btnManual').addEventListener('click',function(){

    }else fallback();
  });
  $('btnSampleReply').addEventListener('click',function(){$('replyText').value=SAMPLE_REPLY;renderRestore();});
  $('btnRestore').addEventListener('click',renderRestore);
  $('replyText').addEventListener('input',renderRestore);

  render();
})();}
